[pytest]
# Pytest configuration for HexRaysPyTools

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Markers
markers =
    ida7: Tests for IDA Pro 7.x compatibility
    ida9: Tests for IDA Pro 9.x+ compatibility
    unit: Unit tests
    integration: Integration tests

# Coverage options (when using pytest-cov)
[coverage:run]
source = HexRaysPyTools
omit =
    */tests/*
    */Img/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
